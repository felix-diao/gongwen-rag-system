version: '3.5'

services:
  etcd:
    container_name: etcd-service
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - milvus-network

  object-storage:
    container_name: minio-storage
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - milvus-network

  vector-db:
    container_name: milvus-db
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: object-storage:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - milvus-network

  attu:
    container_name: attu
    image: zilliz/attu:v2.4
    environment:
      - MILVUS_URL=vector-db:19530
    ports:
      - "3000:3000"
    depends_on:
      vector-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milvus-network

  postgres-db:
    container_name: postgres-db
    image: postgres:17.2
    environment:
      POSTGRES_USER: gongwen_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: gongwen_rag
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gongwen_user} -d ${POSTGRES_DB:-gongwen_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - milvus-network

  # PostgreSQL 自动备份服务
  postgres-backup:
    container_name: postgres-backup
    image: prodrigestivill/postgres-backup-local:17
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_DB=${POSTGRES_DB:-gongwen_rag}
      - POSTGRES_USER=${POSTGRES_USER:-gongwen_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - SCHEDULE=0 2 * * *           # 每天凌晨2点备份
      - BACKUP_KEEP_DAYS=7           # 保留7天每日备份
      - BACKUP_KEEP_WEEKS=2          # 保留2周每周备份
      - BACKUP_KEEP_MONTHS=2         # 保留2个月每月备份
      - BACKUP_DIR=/backups
      - HEALTHCHECK_PORT=8080
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/backups/postgres:/backups
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milvus-network

networks:
  milvus-network:
    name: milvus-network
    driver: bridge